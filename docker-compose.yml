services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ryan_postgres
    environment:
      POSTGRES_DB: ryan_db
      POSTGRES_USER: ryan
      POSTGRES_PASSWORD: "ryan@1904"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryan -d ryan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ryan_app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
